<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<title>方案 A · Precision Instrument</title><link rel="stylesheet" href="tokens.css">
<style>
.head{padding:10px 16px 12px;display:flex;align-items:flex-start;gap:10px}
.head .place{font-size:var(--t-h2);font-weight:700;letter-spacing:.2px}
.head .meta{font-size:var(--t-cap);color:var(--muted);margin-top:2px}
.dialwrap{padding:0 12px 8px}
.dial{position:relative;height:210px;background:linear-gradient(180deg,#0E1F2C,#0B1622);
  border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.dial svg{width:100%;height:100%;display:block}
.dial .az{position:absolute;left:14px;top:12px}
.dial .az b{font-size:var(--t-display);font-weight:800;color:var(--amber);line-height:1}
.dial .az span{display:block;font-size:var(--t-cap);color:var(--muted);margin-top:2px}
.dial .alt{position:absolute;right:14px;top:12px;text-align:right}
.dial .alt b{font-size:var(--t-display);font-weight:800;color:var(--cyan);line-height:1}
.dial .alt span{display:block;font-size:var(--t-cap);color:var(--muted);margin-top:2px}
.readouts{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line)}
.readouts div{padding:10px 12px;border-right:1px solid var(--line)}
.readouts div:last-child{border-right:none}
.readouts b{display:block;font-size:15px;font-weight:700}
.readouts span{font-size:var(--t-micro);color:var(--muted)}
.strip{padding:8px 16px 0}
.strip .bar{height:26px;border-radius:6px;background:var(--surface);position:relative;overflow:hidden;
  border:1px solid var(--line)}
.strip .bar i{position:absolute;top:0;bottom:0;display:block}
.strip .bar .now{width:2px;background:var(--amber);box-shadow:0 0 8px rgba(255,188,107,.8)}
.strip .ticks{display:flex;justify-content:space-between;font-size:var(--t-micro);color:var(--muted);margin-top:4px}
.panel{margin:12px 12px 0;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface)}
.row{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.row .k{flex:1;font-size:var(--t-body)}
.row .v{font-size:var(--t-body);font-weight:700}
.row .v.dim{color:var(--muted);font-weight:500}
.actions{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:8px;padding:12px 12px 16px}
.actions .btn{font-size:12.5px}
</style></head><body style="padding:20px">
<div style="position:relative"><div class="phone"><span class="tag">CONCEPT A · COMPACT · DESIGN_DATA</span>
  <div class="statusbar"><span class="num">09:41</span><span class="num">UTC+08:00</span></div>
  <div class="content">
    <div class="head">
      <div style="flex:1">
        <div class="place">外滩</div>
        <div class="meta num">上海 · 2026-11-05 周三 · 黄金时段</div>
      </div>
      <button class="btn ghost" style="height:32px;padding:0 11px;font-size:11.5px">切换机位</button>
    </div>

    <div class="dialwrap">
      <div class="dial">
        <div class="az"><b class="num">112.4°</b><span>方位 · 东南</span></div>
        <div class="alt"><b class="num">8.6°</b><span>高度角</span></div>
        <svg viewBox="0 0 366 210" preserveAspectRatio="none">
          <g stroke="rgba(226,246,255,.09)"><line x1="0" y1="150" x2="366" y2="150"/>
            <line x1="0" y1="110" x2="366" y2="110"/><line x1="0" y1="70" x2="366" y2="70"/></g>
          <path d="M6 186 Q183 6 360 186" fill="rgba(255,188,107,.07)"/>
          <path d="M6 186 Q183 6 360 186" fill="none" stroke="#FFBC6B" stroke-width="2"/>
          <rect x="86" y="150" width="22" height="36" fill="rgba(115,217,213,.45)"/>
          <rect x="104" y="150" width="30" height="36" fill="rgba(255,188,107,.5)"/>
          <rect x="256" y="150" width="26" height="36" fill="rgba(255,188,107,.5)"/>
          <rect x="282" y="150" width="18" height="36" fill="rgba(115,217,213,.45)"/>
          <line x1="0" y1="186" x2="366" y2="186" stroke="rgba(226,246,255,.28)"/>
          <circle cx="150" cy="116" r="7" fill="#FFBC6B" stroke="#0B1622" stroke-width="3"/>
          <line x1="150" y1="116" x2="150" y2="186" stroke="rgba(255,188,107,.45)" stroke-dasharray="3 4"/>
          <text x="8" y="60" fill="#93A9B6" font-size="9">60°</text>

          <text x="8" y="182" fill="#93A9B6" font-size="9">0°</text>
        </svg>
      </div>
      <div class="readouts" style="border:1px solid var(--line);border-top:none;border-radius:0 0 20px 20px;margin-top:-2px;background:var(--surface)">
        <div><b class="num">09:41</b><span>本地</span></div>
        <div><b class="num">+08:00</b><span>UTC 偏移</span></div>
        <div><b>黄金</b><span>阶段</span></div>
      </div>
    </div>

    <div class="strip">
      <div class="bar">
        <i style="left:3%;width:9%;background:rgba(115,217,213,.5)"></i>
        <i style="left:12%;width:13%;background:rgba(255,188,107,.62)"></i>
        <i style="left:76%;width:12%;background:rgba(255,188,107,.62)"></i>
        <i style="left:88%;width:8%;background:rgba(115,217,213,.5)"></i>
        <i class="now" style="left:42%"></i>
      </div>
      <div class="ticks num"><span>00:00</span><span>06:00</span><span>12:00</span><span>18:00</span><span>24:00</span></div>

    <div class="panel">

      <div class="row"><span class="k">日出 / 日落</span><span class="v num">06:18 / 17:02</span></div>
      <div class="row"><span class="k">当前计划</span><span class="v dim">外滩 · 11-06 06:40</span></div>
    </div>

    <div class="actions">
      <button class="btn primary">反向寻光</button>

      <button class="btn">计划</button>
    </div>
  </div>
  <div class="tabbar"><div class="on"><i></i>今日</div><div><i></i>轨迹</div><div><i></i>计划</div><div><i></i>设置</div><div><i></i>更多</div></div>
</div></div>
</body></html>
